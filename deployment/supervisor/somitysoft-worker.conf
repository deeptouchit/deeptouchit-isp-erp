; ====================================================================
; SomitySoft SaaS Enterprise Queue Worker Configuration
; Copy to: /etc/supervisor/conf.d/somitysoft-worker.conf
; Commands:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start somitysoft-worker:*
; ====================================================================

[program:somitysoft-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/vhosts/somitysoft/somitysoft.com/public_html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=somitysoft
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/vhosts/somitysoft/somitysoft.com/public_html/storage/logs/supervisor-worker.log
stopwaitsecs=3600
