<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (96x96) -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#logoBgGrad)" stroke="url(#logoCyanGrad)" stroke-width="3.5" />
    <!-- Fiber optic signal arcs -->
    <path d="M 22 36 A 30 30 0 0 1 74 36" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M 30 36 A 20 20 0 0 1 66 36" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" filter="url(#logoGlow)" />
    <circle cx="48" cy="36" r="3.5" fill="#ffffff" filter="url(#logoGlow)" />
    <!-- Monogram 'T' -->
    <path d="M 24 48 L 72 48 A 3 3 0 0 1 72 58 L 54 58 L 54 82 A 3 3 0 0 1 42 82 L 42 58 L 24 58 A 3 3 0 0 1 24 48 Z" fill="#ffffff" />
    <!-- Dot -->
    <circle cx="48" cy="88" r="2.5" fill="#22d3ee" />
  </g>

  <!-- Typography: TITHI DIGITAL COMMUNICATION -->
  <g transform="translate(124, 0)">
    <!-- Main Brand Name 'TITHI' -->
    <text x="0" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-0.5">TITHI</text>
    
    <!-- ISP Badge beside Tithi -->
    <rect x="136" y="27" width="96" height="26" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="184" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="1">ISP NETWORK</text>

    <!-- Subtitle: DIGITAL COMMUNICATION -->
    <text x="2" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="url(#textCyanGrad)" letter-spacing="4">DIGITAL COMMUNICATION</text>
    
    <!-- Tagline: High-Speed Optical Fiber Internet -->
    <text x="2" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b" letter-spacing="1.2">HIGH-SPEED BROADBAND &amp; OPTICAL FIBER NETWORK</text>
  </g>
</svg>