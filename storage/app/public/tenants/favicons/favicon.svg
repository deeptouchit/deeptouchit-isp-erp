<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="4" />
  
  <!-- Optical Fiber Signal Waves -->
  <path d="M 30 46 A 38 38 0 0 1 98 46" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M 40 46 A 26 26 0 0 1 88 46" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="64" cy="46" r="4.5" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Stylized Letter 'T' for Tithi -->
  <path d="M 32 62 L 96 62 A 4 4 0 0 1 96 74 L 72 74 L 72 106 A 4 4 0 0 1 56 106 L 56 74 L 32 74 A 4 4 0 0 1 32 62 Z" fill="#ffffff" />
  
  <!-- Tech Accent Indicator -->
  <circle cx="64" cy="114" r="3" fill="#22d3ee" />
</svg>